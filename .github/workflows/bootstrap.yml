name: bootstrap

# Manual: download Loghub BGL, retrain everything from scratch, commit fresh state + metrics.
on:
  workflow_dispatch:
    inputs:
      train_end:
        description: "Last training day (YYYY-MM-DD)"
        default: "2005-08-31"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python -m triage download
      - run: |
          rm -rf state
          python -m triage bootstrap --train-end "${{ inputs.train_end }}"
      - name: Commit state and metrics
        run: |
          git config user.name "faultline-bot"
          git config user.email "faultline-bot@users.noreply.github.com"
          git add -A state metrics
          git diff --cached --quiet || git commit -m "bootstrap: retrain through ${{ inputs.train_end }}" && git push
